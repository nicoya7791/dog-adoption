<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>contact</title>
    <meta name="author" content="Henry Blandon" />
    <meta
      name="description"
      content="people can adopt pets from our local pet shop. 
      we provide friendly service and healthy pets. 
      pets are trained for easy home adaptation. we have a variety of breeds available for adoption,
      including Pit Bulls, golden retrievers, and other popular breeds."
    />
    <meta
      name="keywords"
      content="pet, dogs , adoptions, puppies, dog food, dog grooming, best friends, companion"
    />
    <meta name="date created" content="2026-09-27" />
    <meta name="last updated" content="2026-09-27" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
      integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/contact.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
  </head>
  <!-- The home page Assessed different page layouts and page structures using image placeholders.
Connections: The pages use a ref attribute to connect and facilitate navigation to the contact page and care tips.
Creating value: The page content empathizes with customers looking to adopt a pet.
Christian World View: The page content expresses the virtues of compassion and care.
 -->
  <body>
    <header id="share-nav"></header>
    <main>
      <section class="container">
        <div>
          <form id="contactForm" class="mt-5">
            <div class="form-row">
              <div class="form-group col-md-6">
                <label for="inputName4">Firt Name</label>
                <input
                  type="text"
                  name="firtName"
                  class="form-control"
                  id="inputName4"
                />
              </div>
              <div class="form-group col-md-6">
                <label for="inputLastName4">Last Name</label>
                <input
                  type="text"
                  name="lastName"
                  class="form-control"
                  id="inputLastName4"
                />
              </div>
            </div>
            <div class="form-row">
              <div class="form-group col-md-6">
                <label for="inputEmail4">Email</label>
                <input
                  type="email"
                  name="email"
                  class="form-control"
                  id="inputEmail4"
                />
              </div>
              <div class="form-group col-md-6">
                <label for="inputPhone4">Phone Number</label>
                <input
                  type="text"
                  name="phone"
                  class="form-control"
                  id="inputPhone4"
                />
              </div>
            </div>
            <div class="form-group">
              <label for="exampleFormControlTextarea1">How can we help?</label>
              <textarea
                name="textarea"
                class="form-control"
                id="exampleFormControlTextarea1"
                rows="4"
              ></textarea>
            </div>
            <!-- this is for displaying success message
             also is hidden by default and on submit will be displayed
             on click will be hidden with jquery  -->
            <p id="success-message" class="text-success"></p>

            <button type="submit" class="btn text-white">Send Message</button>
          </form>
        </div>
      </section>
      <section class="container mt-5 bussiness-hours">
        <table class="table table-striped">
          <thead>
            <tr>
              <th scope="col">Day</th>
              <th scope="col">Hours</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Monday</td>
              <td>08:00 AM - 05:00 PM</td>
            </tr>
            <tr>
              <td>Tuesday</td>
              <td>08:00 AM - 05:00 PM</td>
            </tr>
            <tr>
              <td>Wednesday</td>
              <td>11:00 AM - 06:00 PM</td>
            </tr>
            <tr>
              <td>Thursday</td>
              <td>11:00 AM - 06:00 PM</td>
            </tr>
            <tr>
              <td>Friday</td>
              <td>Closed</td>
            </tr>
            <tr>
              <td>Saturday</td>
              <td>01:00 PM - 06:00 PM</td>
            </tr>
            <tr>
              <td>Sunday</td>
              <td>11:00 AM - 06:00 PM</td>
            </tr>
          </tbody>
        </table>
      </section>
      <section class="container bg-white p-3 my-5 map-section">
        <img src="./images/map.png" class="img-fluid" alt="Responsive image" />
      </section>
    </main>
    <footer id="footernav"></footer>
    <script type="module" src="./js/index.js"></script>
    <script src="./js/componentLoader.js"></script>
    <script
      src="https://code.jquery.com/jquery-3.4.1.slim.min.js"
      integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
      integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js"
      integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
