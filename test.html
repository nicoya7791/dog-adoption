    <script>
      //https://youtu.be/cuEtnrL9-H0?si=aqq4tRTb3nCUsSsv
      async function loadLocalJSON() {
        try {
          const response = await fetch("./db/dog.json"); // Path relative to your public/root folder

          // Check if the request was successful
          if (!response.ok) {
            throw new Error(`HTTP error! Status: ${response.status}`);
          }

          const data = await response.json();
          console.log(data);
        } catch (error) {
          console.error("Failed to load JSON:", error);
        }
      }

      loadLocalJSON();
    </script>
