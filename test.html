    <script>
      //https://youtu.be/cuEtnrL9-H0?si=aqq4tRTb3nCUsSsv
      async function loadLocalJSON() {
        try {
          const response = await fetch("./db/dog.json"); // Path relative to your public/root folder

          // Check if the request was successful
          if (!response.ok) {
            throw new Error(`HTTP error! Status: ${response.status}`);
          }

          const data = await response.json();
          console.log(data);
        } catch (error) {
          console.error("Failed to load JSON:", error);
        }
      }

      loadLocalJSON();
    </script>

    <!-- test form post -->
    <script>
      const form = document.getElementById("testForm");
      const output = document.getElementById("responseOutput");

      form.addEventListener("submit", async function (event) {
        // Prevent the default browser form submission (which reloads the page)
        event.preventDefault();

        // Extract form data easily using FormData
        const formData = new FormData(form);

        // Convert FormData to a JSON object (optional, but great for JSON APIs)
        const dataObject = Object.fromEntries(formData.entries());

        try {
          // Send the POST request to httpbin
          const response = await fetch("https://httpbin.org/post", {
            method: "POST",
            headers: {
              "Content-Type": "application/json", // Sending data as JSON
            },
            body: JSON.stringify(dataObject),
          });

          // Parse the JSON response returned by httpbin
          const result = await response.json();
          console.log("Response from httpbin:", result.data);
          const senddata = document.createElement("pre");
          senddata.innerHTML = JSON.stringify(result.data.username, null, 2);
          document.body.appendChild(senddata);

          // Display the echoed data in the pre element
        } catch (error) {}
      });
    </script>
