Connections: The pages use a ref attribute to connect and facilitate navigation to the contact page and care tips.

  <body>
    <header id="share-nav"></header>
    <main>
      <section id="dogdetail"></section>
    </main>
    <footer id="footernav"></footer>
    <!-- <script type="module" src="./js/index.js"></script> -->
    <script src="./js/componentLoader.js"></script>
    <script
      src="https://code.jquery.com/jquery-3.4.1.slim.min.js"
      integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
      integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"

    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js"
      integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6"
      crossorigin="anonymous"
    ></script>
    <script type="module">
      import data from "./db/dog.json" with { type: "json" };

      document.addEventListener("DOMContentLoaded", () => {
        // Your DOM-dependent code goes here
        console.log("The DOM is fully loaded and parsed!");

        const dogIndex = JSON.parse(localStorage.getItem("dogIndex"));
        const dogData = data[dogIndex];
        console.log("Dog name:", dogData.name);
        if (dogData) {
          const dogNameElement = document.querySelector("#dogName");
          console.log("Dog name element:", dogNameElement);
          if (dogNameElement) {
            dogNameElement.textContent = dogData.name;
          } else {
            console.error("Dog name element not found in the DOM");
          }
          // Update other elements with dogData as needed
        } else {
          console.error("Dog not found in data");
        }
      });
    </script>
  </body>
