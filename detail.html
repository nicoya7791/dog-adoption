<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>detail</title>
    <meta name="author" content="Henry Blandon" />
    <meta
      name="description"
      content="people can adopt pets from our local pet shop. 
      we provide friendly service and healthy pets. 
      pets are trained for easy home adaptation. we have a variety of breeds available for adoption,
      including Pit Bulls, golden retrievers, and other popular breeds."
    />
    <meta
      name="keywords"
      content="pet, dogs , adoptions, puppies, dog food, dog grooming, best friends, companion"
    />
    <meta name="date created" content="2026-09-27" />
    <meta name="last updated" content="2026-09-27" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
      integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/detail.css" />
  </head>
  <!-- The home page Assessed different page layouts and page structures using image placeholders.
Connections: The pages use a ref attribute to connect and facilitate navigation to the contact page and care tips.
Creating value: The page content empathizes with customers looking to adopt a pet.
Christian World View: The page content expresses the virtues of compassion and care.
 -->
  <body>
    <header id="share-nav"></header>
    <main>
      <section id="dogdetail"></section>
    </main>
    <footer id="footernav"></footer>
    <!-- <script type="module" src="./js/index.js"></script> -->
    <script src="./js/componentLoader.js"></script>
    <script
      src="https://code.jquery.com/jquery-3.4.1.slim.min.js"
      integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
      integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js"
      integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6"
      crossorigin="anonymous"
    ></script>
    <script type="module">
      import data from "./db/dog.json" with { type: "json" };

      document.addEventListener("DOMContentLoaded", () => {
        // Your DOM-dependent code goes here

        const dogIndex = JSON.parse(localStorage.getItem("dogIndex"));
        const dogData = data[dogIndex];
        if (dogData) {
          const dogIdElement = document.querySelector("#id");
          const dogNameElement = document.querySelector("#dogName");
          const dogBreedElement = document.querySelector("#breed");
          const dogAgeElement = document.querySelector("#age");
          const dogGenderElement = document.querySelector("#gender");
          const dogSizeElement = document.querySelector("#size");
          const dogSpayedNeuteredElement =
            document.querySelector("#spayed-neutered");
          const dogRabiesVaccineElement =
            document.querySelector("#rabies-vaccine");
          const dogPhotoElement = document.querySelector("#photo");

          if (dogIdElement) {
            dogIdElement.textContent = dogData.id;
          } else {
            console.error("Dog ID element not found in the DOM");
          }
          if (dogNameElement) {
            dogNameElement.textContent = dogData.name;
          } else {
            console.error("Dog name element not found in the DOM");
          }
          if (dogBreedElement) {
            dogBreedElement.textContent = dogData.breed;
          } else {
            console.error("Dog breed element not found in the DOM");
          }
          if (dogAgeElement) {
            dogAgeElement.textContent = dogData.age;
          } else {
            console.error("Dog age element not found in the DOM");
          }
          if (dogGenderElement) {
            dogGenderElement.textContent = dogData.gender;
          } else {
            console.error("Dog gender element not found in the DOM");
          }
          if (dogSizeElement) {
            dogSizeElement.textContent = dogData.size;
          } else {
            console.error("Dog size element not found in the DOM");
          }
          if (dogSpayedNeuteredElement) {
            dogSpayedNeuteredElement.textContent = dogData.spayed_neutered;
          } else {
            console.error("Dog spayed/neutered element not found in the DOM");
          }
          if (dogRabiesVaccineElement) {
            dogRabiesVaccineElement.textContent = dogData.rabies_vaccine;
          } else {
            console.error("Dog rabies vaccine element not found in the DOM");
          }
          if (dogPhotoElement) {
            dogPhotoElement.src = dogData.photo;
          } else {
            console.error("Dog photo element not found in the DOM");
          }
        } else {
          console.error("Dog not found in data");
        }
      });
    </script>
  </body>
</html>
